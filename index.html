<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glowra | Skincare &amp; Beauty</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#fdf6f3;--ink:#2a1a22;--mute:#7d6670;--plum:#7a2e4d;--blush:#f6d9df;--line:#ecd9d8;--card:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "DM Sans",system-ui,sans-serif}
h1,h2,h3,.logo{font-family:Fraunces,Georgia,serif;margin:0}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--plum);outline-offset:2px}
header{position:sticky;top:0;z-index:10;background:rgba(253,246,243,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{max-width:1100px;margin:auto;display:flex;align-items:center;gap:14px;padding:12px 20px;flex-wrap:wrap}
.logo{font-size:1.7rem;font-weight:800;color:var(--plum);border:0;background:none;padding:0}
.sp{flex:1}
.btn{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:8px 16px;font-weight:500}
.btn.pri{background:var(--plum);border-color:var(--plum);color:#fff}
.btn:hover{filter:brightness(.97)}.btn.pri:hover{filter:brightness(1.1)}
.wrap{max-width:1100px;margin:auto;padding:24px 20px 80px}
.hero{background:linear-gradient(120deg,var(--blush),#fbe9d9);border-radius:24px;padding:36px 32px;margin-bottom:24px}
.hero h1{font-size:clamp(1.8rem,4vw,2.8rem);line-height:1.15;max-width:560px}
.hero p{color:var(--mute);max-width:480px;margin:10px 0 0}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:20px}
.filters input,.filters select{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:8px 16px}
.filters input{flex:1;min-width:160px}
.chip[aria-pressed=true]{background:var(--plum);border-color:var(--plum);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.ph{aspect-ratio:1;display:grid;place-items:center;font-size:3.6rem}
.ph img{width:100%;height:100%;object-fit:cover}
.pb{padding:14px;display:flex;flex-direction:column;gap:4px;flex:1}
.br{font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--plum)}
.pn{font-weight:500;line-height:1.3}.pd{font-size:.85rem;color:var(--mute);flex:1}
.pr{font-weight:700;margin:6px 0}
aside{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--card);z-index:30;box-shadow:-10px 0 40px rgba(0,0,0,.15);transform:translateX(105%);transition:transform .25s;display:flex;flex-direction:column}
aside.open{transform:none}
.ah{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.al{flex:1;overflow:auto;padding:8px 20px}
.af{padding:18px 20px;border-top:1px solid var(--line)}
.ci{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.ci .em{font-size:1.8rem}.ci .t{flex:1;font-size:.9rem}
.q{display:flex;align-items:center;gap:8px}
.q button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--bg)}
.scrim{position:fixed;inset:0;background:rgba(30,10,20,.4);z-index:20;display:none}.scrim.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px}
.co{display:grid;grid-template-columns:1.2fr 1fr;gap:22px;align-items:start}
.fm{display:grid;gap:12px}.fm label{display:grid;gap:4px;font-size:.85rem;font-weight:500;color:var(--mute)}
.fm input{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg);color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row{display:flex;justify-content:space-between;gap:12px;padding:6px 0}
.tot{font-weight:700;font-size:1.15rem;border-top:1px solid var(--line);margin-top:8px;padding-top:12px}
.msg{text-align:center;padding:40px 12px}.msg .big{font-size:3rem}
.err{color:#b3261e;font-size:.9rem;min-height:1.2em}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 20px;border-radius:99px;z-index:50;display:none}
.acm{position:relative}
.av{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:var(--blush);color:var(--plum);font-weight:700;padding:0;overflow:hidden;display:grid;place-items:center}
.av img{width:100%;height:100%;object-fit:cover}
.dd{position:absolute;right:0;top:50px;min-width:230px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 14px 40px rgba(60,20,40,.18);padding:8px;z-index:40}
.dd .who{padding:10px 12px;border-bottom:1px solid var(--line);margin-bottom:6px}.dd .who b{display:block}.dd .who small{color:var(--mute);overflow-wrap:anywhere}
.dd button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:10px}
.dd button:hover{background:var(--bg)}.dd .dg{color:#b3261e}
.pf{max-width:480px;margin:auto;text-align:center}
.pf .big-av{width:96px;height:96px;margin:0 auto 12px;font-size:2.2rem}
.pf .big-av{width:96px;height:96px;border-radius:50%;background:var(--blush);color:var(--plum);display:grid;place-items:center;overflow:hidden;font-weight:700}
.pf .big-av img{width:100%;height:100%;object-fit:cover}
footer{text-align:center;color:var(--mute);font-size:.85rem;padding:30px 20px}
@media(max-width:760px){.co{grid-template-columns:1fr}.hero{padding:26px 20px}}
</style>
</head>
<body>
<header><div class="bar">
  <button class="logo" id="home">Glowra</button><span class="sp"></span>
  <span id="acct"></span>
  <button class="btn" id="cartBtn">Cart (<span id="cc">0</span>)</button>
</div></header>
<div class="wrap" id="app"></div>
<footer>Glowra is a demo store created for a class project. No real payments are taken.<br><a href="/privacy.html">Privacy Policy</a> · <a href="/terms.html">Terms of Service</a></footer>
<div class="scrim" id="scrim"></div>
<aside id="cart" aria-label="Shopping cart">
  <div class="ah"><h3>Your cart</h3><button class="btn" id="cx">Close</button></div>
  <div class="al" id="cl"></div><div class="af" id="cf"></div>
</aside>
<div class="toast" id="toast" role="status"></div>

<script>
const SB_URL='https://kdvlpfwvniocdujbkowp.supabase.co';
const SB_KEY='sb_publishable_974HaQPl0UAQ4oDYd9bo-w_KJsp9Quz';
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const naira=n=>'₦'+Number(n).toLocaleString('en-NG');
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
let products=[],cart=load('glowra.cart',{}),user=null,session=null,view='shop',cat='All',brand='All',q='',lastOrder=null,orders=[],menuOpen=false;

function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3200)}
const saveCart=()=>{try{localStorage.setItem('glowra.cart',JSON.stringify(cart))}catch(e){}};
const hue=s=>[...s].reduce((a,c)=>a+c.charCodeAt(0),0)%360;
const cartItems=()=>Object.entries(cart).map(([id,qty])=>({p:products.find(x=>x.id===id),qty})).filter(i=>i.p);
const total=()=>cartItems().reduce((s,i)=>s+i.p.price*i.qty,0);
const tile=p=>`<div class="ph" style="background:hsl(${hue(p.name)} 70% 94%)">${p.image_url?`<img src="${esc(p.image_url)}" alt="${esc(p.name)}">`:esc(p.emoji||'✨')}</div>`;

function add(id){cart[id]=(cart[id]||0)+1;saveCart();renderCart();toast('Added to cart')}
function setQty(id,d){cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];saveCart();renderCart()}

function renderHead(){
  if(user){
    const nm=user.user_metadata?.full_name||user.email||'Account',pic=user.user_metadata?.avatar_url||user.user_metadata?.picture;
    $('#acct').innerHTML=`<div class="acm"><button class="av" id="avb" aria-haspopup="true" aria-expanded="${menuOpen}" aria-label="Account menu">${pic?`<img src="${esc(pic)}" alt="" referrerpolicy="no-referrer">`:esc(nm[0].toUpperCase())}</button>${menuOpen?`<div class="dd" role="menu"><div class="who"><b>${esc(nm)}</b><small>${esc(user.email)}</small></div><button role="menuitem" data-go="profile">My profile</button><button role="menuitem" data-go="orders">My orders</button><button role="menuitem" class="dg" id="out">Sign out</button></div>`:''}</div>`;
  }else $('#acct').innerHTML=`<button class="btn pri" id="in">Sign in with Google</button>`;
  $('#cc').textContent=Object.values(cart).reduce((a,b)=>a+b,0);
}
function renderCart(){
  renderHead();const it=cartItems();
  $('#cl').innerHTML=it.length?it.map(({p,qty})=>`<div class="ci"><span class="em">${esc(p.emoji||'✨')}</span><div class="t"><b>${esc(p.name)}</b><br>${naira(p.price)}</div><div class="q"><button data-q="${p.id}" data-d="-1" aria-label="Less">−</button>${qty}<button data-q="${p.id}" data-d="1" aria-label="More">+</button></div></div>`).join(''):'<p style="color:var(--mute)">Your cart is empty.</p>';
  $('#cf').innerHTML=it.length?`<div class="row tot"><span>Total</span><span>${naira(total())}</span></div><button class="btn pri" style="width:100%;margin-top:10px" data-go="checkout">Checkout</button>`:'';
  if(view==='checkout')render();
}
function openCart(o){$('#cart').classList.toggle('open',o);$('#scrim').classList.toggle('on',o)}

function render(){
  renderInner();
  if(view!=='shop'&&view!=='success')$('#app').insertAdjacentHTML('afterbegin','<button class="btn" data-go="shop" style="margin-bottom:18px">&larr; Back to shop</button>');
}
function renderInner(){
  const a=$('#app');window.scrollTo(0,0);
  if(view==='shop'){
    const cats=['All',...new Set(products.map(p=>p.category))],brands=['All',...new Set(products.map(p=>p.brand).filter(Boolean))].sort();
    const list=products.filter(p=>(cat==='All'||p.category===cat)&&(brand==='All'||p.brand===brand)&&(p.name+' '+(p.brand||'')).toLowerCase().includes(q.toLowerCase()));
    a.innerHTML=`<div class="hero"><h1>Skincare and beauty, picked for glowing skin.</h1><p>Serums, cleansers, sunscreens and lip care from brands you love.</p></div>
    <div class="filters"><input id="q" type="search" placeholder="Search products or brands" value="${esc(q)}" aria-label="Search">
    ${cats.map(c=>`<button class="btn chip" data-cat="${esc(c)}" aria-pressed="${cat===c}">${esc(c)}</button>`).join('')}
    <select id="br" aria-label="Brand">${brands.map(b=>`<option ${b===brand?'selected':''}>${esc(b)}</option>`).join('')}</select></div>
    <div class="grid" id="grid">${list.length?list.map(p=>`<div class="pc">${tile(p)}<div class="pb"><span class="br">${esc(p.brand||'')}</span><span class="pn">${esc(p.name)}</span><span class="pd">${esc(p.description||'')}</span><span class="pr">${naira(p.price)}</span><button class="btn pri" data-add="${p.id}">Add to cart</button></div></div>`).join(''):'<p>No products found.</p>'}</div>`;
  }else if(view==='checkout'){
    const it=cartItems();
    if(!it.length){a.innerHTML='<div class="card msg"><div class="big">🛍️</div><h2>Your cart is empty</h2><p><button class="btn pri" data-go="shop">Browse products</button></p></div>';return}
    const summary=`<div class="card"><h3>Order summary</h3>${it.map(({p,qty})=>`<div class="row"><span>${esc(p.name)} × ${qty}</span><span>${naira(p.price*qty)}</span></div>`).join('')}<div class="row tot"><span>Total</span><span>${naira(total())}</span></div></div>`;
    a.innerHTML=`<h2 style="margin-bottom:16px">Checkout</h2><div class="co">`+(user?
    `<form class="card fm" id="cof"><h3>Delivery details</h3>
     <label>Full name<input name="full_name" required value="${esc(user.user_metadata?.full_name||'')}"></label>
     <label>Confirmation email<input name="email" type="email" required value="${esc(user.email)}"></label>
     <label>Phone number<input name="phone" type="tel" required placeholder="0801 234 5678"></label>
     <label>Address<input name="address" required></label>
     <div class="two"><label>City<input name="city" required></label><label>State<input name="state" required></label></div>
     <div class="err" id="err" role="alert"></div><button class="btn pri" id="place">Place order</button></form>`
    :`<div class="card msg"><div class="big">🔐</div><h3>Sign in to continue</h3><p style="color:var(--mute)">We use Google sign-in so your orders are saved to your account.</p><button class="btn pri" id="in2">Sign in with Google</button></div>`)+summary+`</div>`;
  }else if(view==='success'){
    a.innerHTML=`<div class="card msg"><div class="big">💖</div><h2>Thank you, your order is placed!</h2><p>Order <b>#${esc(lastOrder.id.slice(0,8).toUpperCase())}</b> · ${naira(lastOrder.total)}</p><p style="color:var(--mute)">${lastOrder.mailed?'A confirmation email is on its way to '+esc(lastOrder.email)+'.':'Your order is saved. The confirmation email could not be sent right now.'}</p><button class="btn pri" data-go="shop">Keep shopping</button></div>`;
  }else if(view==='profile'){
    if(!user){a.innerHTML='<div class="card msg"><p>Please sign in to see your profile.</p><button class="btn pri" id="in2">Sign in with Google</button></div>';return}
    const nm=user.user_metadata?.full_name||user.email,pic=user.user_metadata?.avatar_url||user.user_metadata?.picture;
    a.innerHTML=`<div class="card pf"><div class="big-av">${pic?`<img src="${esc(pic)}" alt="" referrerpolicy="no-referrer">`:esc(nm[0].toUpperCase())}</div><h2>${esc(nm)}</h2><p style="color:var(--mute);margin:4px 0 16px">${esc(user.email)}</p>
    <div class="row"><span>Orders placed</span><b>${orders.length}</b></div><div class="row"><span>Member since</span><b>${new Date(user.created_at).toLocaleDateString()}</b></div>
    <div style="display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap"><button class="btn" data-go="orders">My orders</button><button class="btn" id="out">Sign out</button></div></div>`;
  }else if(view==='orders'){
    a.innerHTML=`<h2 style="margin-bottom:16px">My orders</h2>`+(orders.length?orders.map(o=>`<div class="card" style="margin-bottom:14px"><div class="row"><b>#${esc(o.id.slice(0,8).toUpperCase())}</b><span>${new Date(o.created_at).toLocaleDateString()}</span></div>${o.order_items.map(i=>`<div class="row"><span>${esc(i.name)} × ${i.quantity}</span><span>${naira(i.price*i.quantity)}</span></div>`).join('')}<div class="row tot"><span>Total · ${esc(o.status)}</span><span>${naira(o.total)}</span></div></div>`).join(''):'<div class="card msg"><p>No orders yet.</p><button class="btn pri" data-go="shop">Start shopping</button></div>');
  }
}
async function go(v){
  view=v;menuOpen=false;renderHead();openCart(false);
  if(v==='orders'||v==='profile'){const{data}=await sb.from('orders').select('*,order_items(*)').order('created_at',{ascending:false});orders=data||[]}
  render();
}
const signIn=()=>sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});

async function place(f){
  const btn=$('#place'),err=$('#err');err.textContent='';btn.disabled=true;btn.textContent='Placing order...';
  const d=Object.fromEntries(new FormData(f)),it=cartItems(),t=total();
  const{data:o,error}=await sb.from('orders').insert({user_id:user.id,email:user.email,total:t,...d}).select().single();
  if(error){err.textContent='Could not place order: '+error.message;btn.disabled=false;btn.textContent='Place order';return}
  const{error:e2}=await sb.from('order_items').insert(it.map(({p,qty})=>({order_id:o.id,product_id:p.id,name:p.name,price:p.price,quantity:qty})));
  if(e2){err.textContent='Could not save items: '+e2.message;btn.disabled=false;btn.textContent='Place order';return}
  let mailed=false;
  try{const r=await fetch('/.netlify/functions/send-order-email',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+session.access_token},body:JSON.stringify({order_id:o.id})});mailed=r.ok}catch(e){}
  cart={};saveCart();lastOrder={...o,mailed};view='success';renderCart();render();
}

document.addEventListener('click',e=>{
  if(menuOpen&&!e.target.closest('.acm')){menuOpen=false;renderHead()}
  const t=e.target.closest('button');if(!t)return;
  if(t.id==='avb'){menuOpen=!menuOpen;renderHead();return}
  if(t.id==='home')go('shop');else if(t.id==='cartBtn')openCart(true);else if(t.id==='cx')openCart(false);
  else if(t.id==='in'||t.id==='in2')signIn();
  else if(t.id==='out')sb.auth.signOut().then(()=>{user=session=null;orders=[];menuOpen=false;renderHead();go('shop')});
  else if(t.dataset.go)go(t.dataset.go);
  else if(t.dataset.add)add(t.dataset.add);
  else if(t.dataset.q)setQty(t.dataset.q,+t.dataset.d);
  else if(t.dataset.cat){cat=t.dataset.cat;render()}
});
$('#scrim').onclick=()=>openCart(false);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&menuOpen){menuOpen=false;renderHead()}});
document.addEventListener('input',e=>{if(e.target.id==='q'){q=e.target.value;const p=e.target.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(p,p)}});
document.addEventListener('change',e=>{if(e.target.id==='br'){brand=e.target.value;render()}});
document.addEventListener('submit',e=>{if(e.target.id==='cof'){e.preventDefault();place(e.target)}});

sb.auth.onAuthStateChange((_ev,s)=>{session=s;user=s?.user||null;renderHead();if(view==='checkout')render()});
(async()=>{
  const{data:{session:s}}=await sb.auth.getSession();session=s;user=s?.user||null;
  const{data,error}=await sb.from('products').select('*').order('brand');
  if(error)$('#app').innerHTML='<div class="card msg"><h3>Could not load products</h3><p>'+esc(error.message)+'</p></div>';
  else{products=data;
    if(new URLSearchParams(location.search).get('checkout')||sessionStorage.getItem('glowra.back')){}
    render()}
  renderCart();
})();
</script>
</body>
</html>
